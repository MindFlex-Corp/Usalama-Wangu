databases:
  - name: usalama_wangu_db
    plan: free
    databaseName: usalama_wangu_db
    user: admin

services:
  - type: web
    plan: free
    name: usalama-wangu-app
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn backend.Usalama_Wangu.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: usalama_wangu_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4